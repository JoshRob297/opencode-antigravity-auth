name: Canary

# Daily build and test on a clean runner: catches dependency rot and Node
# changes before a user hits them. The credentialed end-to-end run against
# the live Antigravity service needs an account, so it runs from the
# operator's machine, not here.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
